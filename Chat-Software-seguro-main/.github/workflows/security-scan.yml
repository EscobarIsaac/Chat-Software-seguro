name: biometric-ai-scan

on:
  push:
    branches: ["main", "dev", "test"]
  pull_request:
    branches: ["main", "dev", "test"]

jobs:
  ai_gateway_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Run IA scan via gateway
        env:
          BIOMETRIC_GATEWAY_URL: ${{ secrets.BIOMETRIC_GATEWAY_URL }}
          CI_GATEWAY_TIMEOUT: 15
        run: python scripts/ci_gateway_scan.py

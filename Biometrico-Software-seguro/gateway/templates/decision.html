<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Autorización biométrica</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .panel {
            background: #111827;
            border-radius: 18px;
            border: 1px solid #1f2937;
            padding: 32px;
            width: min(480px, 95vw);
            text-align: center;
            box-shadow: 0 30px 80px rgba(15, 23, 42, 0.8);
        }
        h1 {
            margin-top: 0;
            color: #38bdf8;
        }
        .status {
            font-size: 0.95rem;
            margin: 12px 0 24px;
        }
        .status.approved { color: #4ade80; }
        .status.rejected { color: #f87171; }
        .status.error { color: #fbbf24; }
        a.button {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 24px;
            border-radius: 10px;
            background: #38bdf8;
            color: #0f172a;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <section class="panel">
        <h1>Registro biométrico</h1>
        <p class="status {{ status }}">{{ message }}</p>
        {% if request %}
        <p>Solicitud: <strong>{{ request.id }}</strong></p>
        <p>Usuario: <strong>{{ request.username }}</strong></p>
        {% endif %}
        <a class="button" href="javascript:window.close();">Cerrar ventana</a>
    </section>
</body>
</html>
